name: CI

on:
  push:
    branches: ["*"]
    paths:
      - grammar.js
      - src/**
      - test/**
      - bindings/**
      - binding.gyp
      - .github/workflows/ci.yml

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  test:
    name: Test parser
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest is omitted: parser-test-action's `npm install` runs
        # node-gyp-build, which fails because the bundled node-gyp cannot detect
        # Visual Studio 18 on the runner (upstream node-gyp bug, not fixable here).
        # The Windows job only builds/runs the platform-independent corpus tests,
        # already covered by ubuntu-latest and macos-latest.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up the repo
        uses: tree-sitter/setup-action/cli@v2
      - name: Run tests
        uses: tree-sitter/parser-test-action@v2
        with:
          test-rust: ${{runner.os == 'Linux'}}
          test-node: ${{runner.os == 'Linux'}}
          test-python: ${{runner.os == 'Linux'}}
          test-go: ${{runner.os == 'Linux'}}
  fuzz:
    name: Fuzz parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fuzz parser
        uses: tree-sitter/fuzz-action@v4
